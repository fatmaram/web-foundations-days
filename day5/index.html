<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: "Nunito", system-ui, sans-serif;
      background: #f3f1ec;
      color: #2f2a26;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
    }

    h1,
    h2 {
      font-family: "Lexend", system-ui, sans-serif;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      font: inherit;
      border: 1px solid #c9c2b8;
      border-radius: 8px;
    }

    button {
      padding: 10px 18px;
      font: inherit;
      background: #4f7255;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background: #b86f50;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 1.5em;
      font-weight: bold;
    }

    .loading {
      color: #5a524a;
    }

    .success {
      color: #4f7255;
    }

    .error {
      color: #c0392b;
    }

    #users-list {
      list-style: none;
      padding: 0;
    }

    .user-card {
      background: #ffffff;
      border-left: 6px solid #4f7255;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .user-card h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .user-card p {
      margin: 2px 0;
    }

    .empty-message {
      color: #5a524a;
      font-style: italic;
    }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <main>
    <h1>User Directory</h1>
    <button id="load-users" type="button">Load users</button>

    <label for="filter-input">Filter by name</label>
    <input type="text" id="filter-input" placeholder="Type a name">

    <p id="status"></p>
    <ul id="users-list"></ul>
  </main>
</body>
</html>
